
name: Day 2 CI
run-name: Day 2 CI by ${{ github.actor }}

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      python-version:
        description: Python version
        type: choice
        options:
          - "3.12"
          - "3.13"
        default: "3.13"
        required: true
      create-package:
        description: Create package
        type: boolean
        default: true
        required: true

  schedule:
    - cron: '0 7 * * 1'

permissions:
  contents: read

env:
  APP_NAME: temperature

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version || '3.13' }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -v

      - name: Report test failure
        if: failure()
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: echo "🚨 Tests failed on $BRANCH_NAME"

  package:
    needs: test
    if: ${{ needs.test.result == 'success' && (github.event_name != 'workflow_dispatch' || inputs.create-package) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      version: ${{ steps.package_version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set package version
        id: package_version
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: echo "version=0.1.${RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Create package
        env:
          APP_NAME: ${{ env.APP_NAME }}
        run: tar -czf "${APP_NAME}.tar.gz" temperature.py test_temperature.py requirements-dev.txt

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: app-package
          path: temperature.tar.gz

  verify:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: app-package

      - name: Verify package
        run: |
          tar -tzf temperature.tar.gz
          mkdir extracted
          tar -xzf temperature.tar.gz -C extracted
          cd extracted
          python -c "from temperature import celsius_to_fahrenheit, fahrenheit_to_celsius, is_freezing; assert celsius_to_fahrenheit(0) == 32; assert fahrenheit_to_celsius(32) == 0; assert is_freezing(-5); print('Package verified successfully')"

  report:
    needs: [test, package]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Write job summary
        env:
          APP_NAME: ${{ env.APP_NAME }}
          VERSION: ${{ needs.package.outputs.version || 'n/a' }}
          COMMIT_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          TEST_RESULT: ${{ needs.test.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
        run: |
          SHORT_SHA="${COMMIT_SHA:0:7}"

          {
            echo "## CI Report"
            echo ""
            echo "| Item | Result |"
            echo "|---|---|"
            echo "| App name | $APP_NAME |"
            echo "| Version | $VERSION |"
            echo "| Commit | $SHORT_SHA |"
            echo "| Event | $EVENT_NAME |"
            echo "| Test | $TEST_RESULT |"
            echo "| Package | $PACKAGE_RESULT |"
          } >> "$GITHUB_STEP_SUMMARY"
