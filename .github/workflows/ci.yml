
name: Day 2 CI
run-name: Day 2 CI by ${{ github.actor }}

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      python-version:
        description: Python version
        type: choice
        options:
          - "3.12"
          - "3.13"
        default: "3.13"
        required: true
      create-package:
        description: Create package
        type: boolean
        default: true
        required: true

  schedule:
    - cron: '0 7 * * 1'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version || '3.13' }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -v

      - name: Report test failure
        if: failure()
        run: echo "🚨 Tests failed on ${{ github.ref_name }}"

  package:
    needs: test
    if: ${{ inputs.create-package != false }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create package
        run: tar -czf app.tar.gz temperature.py test_temperature.py requirements-dev.txt

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: app-package
          path: app.tar.gz

  verify:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: app-package

      - name: Check package
        run: |
          tar -tzf app.tar.gz
          mkdir extracted
          tar -xzf app.tar.gz -C extracted
          cd extracted
          python -c "from temperature import celsius_to_fahrenheit, fahrenheit_to_celsius, is_freezing; assert celsius_to_fahrenheit(0) == 32; assert fahrenheit_to_celsius(32) == 0; assert is_freezing(-5); print('Package verified successfully')"

  report:
    needs: [test, package]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Report job results
        run: |
          echo "Test result: ${{ needs.test.result }}"
          echo "Package result: ${{ needs.package.result }}"
