
name: Day 2 CI
run-name: Day 2 CI by ${{ github.actor }}

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      python-version:
        description: Python version
        type: choice
        options:
          - "3.12"
          - "3.13"
        default: "3.13"
        required: true
      create-package:
        description: Create package
        type: boolean
        default: true
        required: true

  schedule:
    - cron: '0 7 * * 1-5'

permissions:
  contents: read

env:
  APP_NAME: temperature

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version || '3.13' }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Security scan - pre
        uses: ./.github/actions/security-scan
        with:
          phase: pre

      - name: Run tests
        run: |
          mkdir -p reports
          python -m pytest -v --junitxml=reports/junit.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: reports/junit.xml
          if-no-files-found: warn
          retention-days: 5
      - name: Security scan - post
        if: always()
        uses: ./.github/actions/security-scan
        with:
          phase: post

      - name: Report test failure
        if: failure()
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          echo " Tests failed on $BRANCH_NAME"

  package:
    needs: test
    if: ${{ needs.test.result == 'success' && (github.event_name != 'workflow_dispatch' || inputs.create-package) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      version: ${{ steps.package_version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set package version
        id: package_version
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          echo "version=0.1.${RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Create package
        env:
          APP_NAME: ${{ env.APP_NAME }}
          VERSION: ${{ steps.package_version.outputs.version }}
        run: |
          mkdir -p dist
          tar -czf "dist/${APP_NAME}-${VERSION}.tar.gz" temperature.py README.md

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: dist/temperature-*.tar.gz
          if-no-files-found: error
          retention-days: 5

  verify:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: package
          path: dist

      - name: Extract package
        env:
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          mkdir -p extracted
          tar -xzf "dist/temperature-${VERSION}.tar.gz" -C extracted

      - name: Verify package
        working-directory: extracted
        run: |
          python3 -c "from temperature import celsius_to_fahrenheit as c; assert c(100) == 212; print('Package OK')"

  report:
    needs: [test, package]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      NOTIFY_ENABLED: ${{ secrets.NOTIFY_TOKEN != '' }}

    steps:
      - name: Write job summary
        env:
          REPORT_TITLE: ${{ vars.REPORT_TITLE }}
          APP_NAME: ${{ env.APP_NAME }}
          VERSION: ${{ needs.package.outputs.version || 'n/a' }}
          COMMIT_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          TEST_RESULT: ${{ needs.test.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
        run: |
          SHORT_SHA="${COMMIT_SHA:0:7}"
          TITLE="${REPORT_TITLE:-Temperature CI Report}"

          {
            echo "## $TITLE"
            echo ""
            echo "| Item | Result |"
            echo "|---|---|"
            echo "| App name | $APP_NAME |"
            echo "| Version | $VERSION |"
            echo "| Commit | $SHORT_SHA |"
            echo "| Event | $EVENT_NAME |"
            echo "| Test | $TEST_RESULT |"
            echo "| Package | $PACKAGE_RESULT |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Send notification
        if: env.NOTIFY_ENABLED == 'true'
        env:
          NOTIFY_TOKEN: ${{ secrets.NOTIFY_TOKEN }}
        run: |
          TOKEN_LENGTH=${#NOTIFY_TOKEN}
          echo "Notification sent (token length: $TOKEN_LENGTH)"

  pr-comment:
    needs: package
    if: ${{ github.event_name == 'pull_request' && needs.package.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      pull-requests: write

    steps:
      - name: Comment on pull request
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const version = '${{ needs.package.outputs.version }}';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: ` CI passed. Package version ${version} is ready.`
            });
